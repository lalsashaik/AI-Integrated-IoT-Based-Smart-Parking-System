<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastructure Manager - Batch-30</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/book.css">
  <link rel="stylesheet" href="css/manage-wallets.css">
  <style>
    .grid-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .tool-card { background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .tool-card h4 { margin-top: 0; color: var(--primary-blue); font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; }
    .tool-flex { display: flex; gap: 10px; }
    .tool-flex input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; }
    .slot.maintenance { background: #fee2e2 !important; color: #b91c1c !important; border: 2px solid #fca5a5 !important; }
    .slot.vacant { background: #f0fdf4 !important; color: #166534 !important; border: 2px solid #bbf7d0 !important; }
    .slot:hover { transform: scale(1.05); cursor: pointer; }
    .results-badge { background: var(--primary-blue); color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="content-area">
      <div class="welcome-section">
        <h2>Parking Grid Manager</h2>
        <p>Configure parking layouts by adding or removing blocks of slots dynamically.</p>
      </div>

      <div class="form-card">
        <div class="card-body">
          <label class="section-label">Select Complex Location</label>
          <select id="manage-complex-select" class="input-group">
            <option value="" disabled selected>-- Choose Complex --</option>
            <option value="City Center Mall">City Center Mall</option>
            <option value="Gopalapuram Main">Gopalapuram Main Complex</option>
            <option value="Railway Station">Railway Station Parking</option>
          </select>
        </div>
      </div>

      <div id="management-ui" class="hidden animate-slide-up">
        <div class="grid-tools">
          <div class="tool-card">
            <h4><i class="fas fa-plus-circle"></i> Bulk Add Slots</h4>
            <div class="tool-flex">
              <input type="number" id="add-qty" placeholder="How many slots?" min="1" max="50">
              <button class="btn-pay" id="btn-bulk-add" style="margin:0; background:#1e4f73;">Add Slots</button>
            </div>
          </div>
          <div class="tool-card">
            <h4><i class="fas fa-trash-alt"></i> Bulk Remove Slots</h4>
            <div class="tool-flex">
              <input type="number" id="del-qty" placeholder="Remove last N slots?" min="1">
              <button class="btn-pay" id="btn-bulk-del" style="margin:0; background:#ef4444;">Delete Slots</button>
            </div>
          </div>
        </div>

        <div class="form-card">
          <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
            <h3><i class="fas fa-th"></i> Grid Layout: <span id="active-complex-name"></span></h3>
            <span id="slot-total-count" class="results-badge">0 Slots</span>
          </div>
          <div class="card-body">
            <div id="admin-slot-grid" class="slot-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="status-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="m-slot-id"></h3>
      <p>Toggle this slot's operational status:</p>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="set-vacant" class="btn-pay" style="flex:1; background:#10b981;">Vacant</button>
        <button id="set-maint" class="btn-pay" style="flex:1; background:#ef4444;">Maintenance</button>
      </div>
      <button onclick="document.getElementById('status-modal').classList.add('hidden')" style="margin-top:15px; background:none; border:none; color:#94a3b8; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <div id="overflow-notification" class="overflow-msg"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/manage-parking.js"></script>
</body>
</html>
