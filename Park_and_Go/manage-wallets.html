<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Wallets - Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/manage-wallets.css"> </head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="content-area">
      <div class="welcome-section">
        <h2>Wallet Management</h2>
        <p>Search by Name, Vehicle, Aadhaar, or Email to process a recharge.</p>
      </div>

      <div class="admin-recharge-box">
        <div class="search-section">
          <label class="section-label">Global User Search</label>
          <div class="search-bar-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="global-search-input" placeholder="Search by name, vehicle, or Aadhaar...">
            <button class="btn-search-trigger" id="btn-search-all">Find User</button>
          </div>
        </div>

        <div id="search-results-section" class="search-results-table hidden">
          <div class="results-header">
            <h4><i class="fas fa-users-viewfinder"></i> Matching Records</h4>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>User Identity</th>
                  <th>Vehicle Number</th>
                  <th>Aadhaar</th>
                  <th>Balance</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="search-results-tbody"></tbody>
            </table>
          </div>
        </div>

        <div id="recharge-form-section" class="hidden animate-slide-up">
          <div class="selected-user-card">
            <div class="user-meta">
              <div class="user-avatar-small" id="sel-user-initials">US</div>
              <div>
                <h3 id="sel-user-name"></h3>
                <p id="sel-user-details"></p>
              </div>
            </div>
            <div class="balance-meta">
              <span>Current Assets</span>
              <div id="sel-user-balance"></div>
            </div>
          </div>

          <div class="recharge-input-container">
            <label><i class="fas fa-money-bill-wave"></i> Amount to Add (Cash Received)</label>
            <div class="currency-input">
              <span>₹</span>
              <input type="number" id="admin-recharge-amt" placeholder="0.00">
            </div>
            <button class="btn-recharge-final" id="btn-process-recharge">
              Confirm Cash Recharge
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="overflow-notification" class="overflow-msg"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/manage-wallets.js"></script>
</body>
</html>
